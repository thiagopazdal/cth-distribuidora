<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTH - Panel Admin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #171717;
        }

        :root {
            --gold: #c9a227;
            --gold-dark: #9d7812;
            --black: #151515;
        }

        /* HEADER */

        .admin-header {
            height: 75px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #151515;
            color: white;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #e1c45a,
                #9d7812
            );

            font-weight: 900;
        }

        .admin-logo strong {
            color: #e1c45a;
            font-size: 20px;
        }

        .admin-logo span {
            display: block;
            color: #999;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .back-button {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .back-button:hover {
            color: #e1c45a;
        }

        /* CONTENEDOR */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .title {
            margin-bottom: 30px;
        }

        .title span {
            color: var(--gold-dark);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .title h1 {
            margin-top: 8px;
            font-size: 38px;
        }

        /* ESTADÍSTICAS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat {
            padding: 25px;

            background: white;

            border: 1px solid #e9e9e9;
            border-radius: 16px;
        }

        .stat span {
            color: #777;
            font-size: 13px;
        }

        .stat strong {
            display: block;
            margin-top: 8px;

            color: var(--gold-dark);

            font-size: 30px;
        }

        /* PRODUCTOS */

        .products-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .products-header h2 {
            font-size: 25px;
        }

        .add-button {
            border: none;

            padding: 13px 20px;

            border-radius: 8px;

            background: var(--gold);
            color: white;

            font-weight: 900;

            cursor: pointer;

            transition: 0.3s;
        }

        .add-button:hover {
            background: var(--gold-dark);
        }

        /* TABLA */

        .table-container {
            overflow-x: auto;

            background: white;

            border: 1px solid #e9e9e9;

            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 18px;

            text-align: left;

            border-bottom: 1px solid #eeeeee;
        }

        th {
            color: #777;

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        .product-name {
            font-weight: 700;
        }

        .price {
            color: var(--gold-dark);
            font-weight: 900;
        }

        .status {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: #fff8df;

            color: var(--gold-dark);

            font-size: 11px;

            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .edit,
        .delete {
            border: none;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 11px;

            font-weight: 800;
        }

        .edit {
            background: #eeeeee;
            color: #333;
        }

        .delete {
            background: #151515;
            color: white;
        }

        /* VACÍO */

        .empty {
            padding: 60px 20px;

            text-align: center;

            color: #777;
        }

        .empty strong {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 20px;
        }

        /* CELULAR */

        @media (max-width: 700px) {

            .admin-header {
                padding: 0 5%;
            }

            .container {
                width: 92%;
                margin: 30px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .title h1 {
                font-size: 30px;
            }

            .products-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="admin-header">

        <div class="admin-logo">

            <div class="logo-box">
                CTH
            </div>

            <div>
                <strong>CTH</strong>
                <span>PANEL ADMIN</span>
            </div>

        </div>

        <a
            href="index.html"
            class="back-button">

            ← Volver a la tienda

        </a>

    </header>


    <!-- CONTENIDO -->

    <main class="container">

        <div class="title">

            <span>ADMINISTRACIÓN</span>

            <h1>
                Panel de control
            </h1>

        </div>


        <!-- ESTADÍSTICAS -->

        <section class="stats">

            <div class="stat">

                <span>
                    Productos
                </span>

                <strong>
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Stock
                </span>

                <strong>
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Ventas
                </span>

                <strong>
                    $0
                </strong>

            </div>

        </section>


        <!-- PRODUCTOS -->

        <section>

            <div class="products-header">

                <h2>
                    Mis productos
                </h2>

                <button
                    class="add-button">

                    + AGREGAR PRODUCTO

                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Producto
                            </th>

                            <th>
                                Categoría
                            </th>

                            <th>
                                Precio
                            </th>

                            <th>
                                Stock
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr>

                            <td colspan="5">

                                <div class="empty">

                                    <strong>
                                        Todavía no hay productos
                                    </strong>

                                    Agregá tu primer producto
                                    desde el botón de arriba.

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</body>

</html>
