<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CTH - Panel Admin</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #171717;
        }

        :root {
            --gold: #c9a227;
            --gold-dark: #9d7812;
            --black: #151515;
        }

        /* HEADER */

        .admin-header {
            height: 75px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #151515;
            color: white;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #e1c45a,
                    #9d7812
                );

            font-weight: 900;
        }

        .admin-logo strong {
            color: #e1c45a;
            font-size: 20px;
        }

        .admin-logo span {
            display: block;
            color: #999;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .back-button {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .back-button:hover {
            color: #e1c45a;
        }

        /* CONTENEDOR */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .title {
            margin-bottom: 30px;
        }

        .title span {
            color: var(--gold-dark);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .title h1 {
            margin-top: 8px;
            font-size: 38px;
        }

        /* ESTADÍSTICAS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat {
            padding: 25px;

            background: white;

            border: 1px solid #e9e9e9;
            border-radius: 16px;
        }

        .stat span {
            color: #777;
            font-size: 13px;
        }

        .stat strong {
            display: block;
            margin-top: 8px;

            color: var(--gold-dark);

            font-size: 30px;
        }

        /* PRODUCTOS */

        .products-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .products-header h2 {
            font-size: 25px;
        }

        .add-button {
            border: none;

            padding: 13px 20px;

            border-radius: 8px;

            background: var(--gold);
            color: white;

            font-weight: 900;

            cursor: pointer;

            transition: 0.3s;
        }

        .add-button:hover {
            background: var(--gold-dark);
        }

        /* TABLA */

        .table-container {
            overflow-x: auto;

            background: white;

            border: 1px solid #e9e9e9;

            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 18px;

            text-align: left;

            border-bottom: 1px solid #eeeeee;
        }

        th {
            color: #777;

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        .product-name {
            font-weight: 700;
        }

        .price {
            color: var(--gold-dark);
            font-weight: 900;
        }

        .status {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: #fff8df;

            color: var(--gold-dark);

            font-size: 11px;

            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .edit,
        .delete {
            border: none;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 11px;

            font-weight: 800;
        }

        .edit {
            background: #eeeeee;
            color: #333;
        }

        .delete {
            background: #151515;
            color: white;
        }

        /* VACÍO */

        .empty {
            padding: 60px 20px;

            text-align: center;

            color: #777;
        }

        .empty strong {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 20px;
        }

        /* MODAL */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.65);

            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 30px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 25px;
        }

        .close-button {
            width: 35px;
            height: 35px;

            border: none;

            border-radius: 50%;

            background: #eeeeee;

            cursor: pointer;

            font-size: 18px;
        }

        /* FORMULARIO */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 800;

            color: #555;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            padding: 13px;

            border: 1px solid #dddddd;

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--gold);
        }

        .checkbox-group {
            display: flex;

            align-items: center;

            gap: 10px;

            margin: 20px 0;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
        }

        .checkbox-group label {
            font-size: 14px;
            font-weight: 700;
        }

        .form-buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        .save-button,
        .cancel-button {
            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 900;
        }

        .save-button {
            background: var(--gold);

            color: white;
        }

        .save-button:hover {
            background: var(--gold-dark);
        }

        .cancel-button {
            background: #eeeeee;

            color: #333;
        }

        /* IMAGEN */

        .product-preview {
            display: none;

            width: 100%;
            height: 180px;

            object-fit: contain;

            margin-top: 10px;

            border-radius: 10px;

            background: #f5f5f5;
        }

        .product-preview.show {
            display: block;
        }

        /* CELULAR */

        @media (max-width: 700px) {

            .admin-header {
                padding: 0 5%;
            }

            .container {
                width: 92%;
                margin: 30px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .title h1 {
                font-size: 30px;
            }

            .products-header {
                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

            .add-button {
                width: 100%;
            }

            .modal-box {
                padding: 22px;
            }

        }

    </style>

</head>

<body>


    <!-- HEADER -->

    <header class="admin-header">

        <div class="admin-logo">

            <div class="logo-box">
                CTH
            </div>

            <div>

                <strong>CTH</strong>

                <span>
                    PANEL ADMIN
                </span>

            </div>

        </div>


        <a
            href="index.html"
            class="back-button">

            ← Volver a la tienda

        </a>

    </header>


    <!-- CONTENIDO -->

    <main class="container">


        <div class="title">

            <span>
                ADMINISTRACIÓN
            </span>

            <h1>
                Panel de control
            </h1>

        </div>


        <!-- ESTADÍSTICAS -->

        <section class="stats">


            <div class="stat">

                <span>
                    Productos
                </span>

                <strong id="totalProducts">
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Stock total
                </span>

                <strong id="totalStock">
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Valor del catálogo
                </span>

                <strong id="totalValue">
                    $0
                </strong>

            </div>


        </section>


        <!-- PRODUCTOS -->

        <section>


            <div class="products-header">

                <h2>
                    Mis productos
                </h2>


                <button
                    class="add-button"
                    id="addProductButton">

                    + AGREGAR PRODUCTO

                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Producto
                            </th>

                            <th>
                                Categoría
                            </th>

                            <th>
                                Precio
                            </th>

                            <th>
                                Stock
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                    </thead>


                    <tbody id="productsTable">

                    </tbody>

                </table>

            </div>


        </section>


    </main>


    <!-- MODAL -->

    <div
        class="modal"
        id="productModal">


        <div class="modal-box">


            <div class="modal-header">

                <h2 id="modalTitle">
                    Agregar producto
                </h2>


                <button
                    class="close-button"
                    id="closeModal">

                    ×

                </button>

            </div>


            <form id="productForm">


                <div class="form-group">

                    <label>
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Ej: Cargador USB-C"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Descripción
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Describe el producto..."
                        required></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Precio ($)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="15000"
                        min="0"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Categoría
                    </label>

                    <select
                        id="productCategory"
                        required>

                        <option value="">
                            Seleccionar categoría
                        </option>

                        <option value="Hogar">
                            Hogar
                        </option>

                        <option value="Tecnología">
                            Tecnología
                        </option>

                        <option value="Cocina">
                            Cocina
                        </option>

                        <option value="Otros">
                            Otros
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        placeholder="10"
                        min="0"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        URL de la imagen
                    </label>

                    <input
                        type="url"
                        id="productImage"
                        placeholder="https://...">

                    <img
                        id="productPreview"
                        class="product-preview"
                        alt="Vista previa">

                </div>


                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="productFeatured">

                    <label>
                        ⭐ Producto destacado
                    </label>

                </div>


                <div class="form-buttons">

                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelButton">

                        CANCELAR

                    </button>


                    <button
                        type="submit"
                        class="save-button">

                        💾 GUARDAR PRODUCTO

                    </button>

                </div>


            </form>


        </div>

    </div>


    <script>

        /* ============================
           DATOS
        ============================ */

        let products =
            JSON.parse(
                localStorage.getItem("cthProducts")
            ) || [];

        let editingId = null;


        /* ============================
           ELEMENTOS
        ============================ */

        const modal =
            document.getElementById("productModal");

        const addButton =
            document.getElementById("addProductButton");

        const closeButton =
            document.getElementById("closeModal");

        const cancelButton =
            document.getElementById("cancelButton");

        const form =
            document.getElementById("productForm");

        const table =
            document.getElementById("productsTable");


        /* ============================
           ABRIR MODAL
        ============================ */

        addButton.addEventListener(
            "click",
            () => {

                editingId = null;

                document.getElementById(
                    "modalTitle"
                ).textContent =
                    "Agregar producto";

                form.reset();

                document.getElementById(
                    "productPreview"
                ).classList.remove("show");

                modal.classList.add("active");

            }
        );


        /* ============================
           CERRAR MODAL
        ============================ */

        function closeModal() {

            modal.classList.remove("active");

            form.reset();

            editingId = null;

            document.getElementById(
                "productPreview"
            ).classList.remove("show");

        }


        closeButton.addEventListener(
            "click",
            closeModal
        );

        cancelButton.addEventListener(
            "click",
            closeModal
        );


        /* ============================
           GUARDAR PRODUCTO
        ============================ */

        form.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();


                const product = {

                    id:
                        editingId ||
                        Date.now(),

                    name:
                        document.getElementById(
                            "productName"
                        ).value.trim(),

                    description:
                        document.getElementById(
                            "productDescription"
                        ).value.trim(),

                    price:
                        Number(
                            document.getElementById(
                                "productPrice"
                            ).value
                        ),

                    category:
                        document.getElementById(
                            "productCategory"
                        ).value,

                    stock:
                        Number(
                            document.getElementById(
                                "productStock"
                            ).value
                        ),

                    image:
                        document.getElementById(
                            "productImage"
                        ).value.trim(),

                    featured:
                        document.getElementById(
                            "productFeatured"
                        ).checked

                };


                if (editingId) {

                    products =
                        products.map(
                            item =>
                                item.id === editingId
                                    ? product
                                    : item
                        );

                } else {

                    products.push(product);

                }


                localStorage.setItem(
                    "cthProducts",
                    JSON.stringify(products)
                );


                renderProducts();

                closeModal();

            }
        );


        /* ============================
           MOSTRAR PRODUCTOS
        ============================ */

        function renderProducts() {

            table.innerHTML = "";


            if (products.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td colspan="5">

                            <div class="empty">

                                <strong>
                                    Todavía no hay productos
                                </strong>

                                Agregá tu primer producto
                                desde el botón de arriba.

                            </div>

                        </td>

                    </tr>

                `;

            }


            products.forEach(
                product => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>

                            <span class="product-name">

                                ${escapeHTML(
                                    product.name
                                )}

                            </span>

                        </td>


                        <td>

                            <span class="status">

                                ${escapeHTML(
                                    product.category
                                )}

                            </span>

                        </td>


                        <td>

                            <span class="price">

                                ${formatPrice(
                                    product.price
                                )}

                            </span>

                        </td>


                        <td>

                            ${product.stock}

                        </td>


                        <td>

                            <div class="actions">

                                <button
                                    class="edit"
                                    onclick="editProduct(${product.id})">

                                    EDITAR

                                </button>


                                <button
                                    class="delete"
                                    onclick="deleteProduct(${product.id})">

                                    ELIMINAR

                                </button>

                            </div>

                        </td>

                    `;


                    table.appendChild(row);

                }
            );


            updateStats();

        }


        /* ============================
           EDITAR
        ============================ */

        window.editProduct =
            function(id) {

                const product =
                    products.find(
                        item => item.id === id
                    );


                if (!product) return;


                editingId = id;


                document.getElementById(
                    "modalTitle"
                ).textContent =
                    "Editar producto";


                document.getElementById(
                    "productName"
                ).value =
                    product.name;


                document.getElementById(
                    "productDescription"
                ).value =
                    product.description;


                document.getElementById(
                    "productPrice"
                ).value =
                    product.price;


                document.getElementById(
                    "productCategory"
                ).value =
                    product.category;


                document.getElementById(
                    "productStock"
                ).value =
                    product.stock;


                document.getElementById(
                    "productImage"
                ).value =
                    product.image || "";


                document.getElementById(
                    "productFeatured"
                ).checked =
                    product.featured;


                updatePreview();


                modal.classList.add("active");

            };


        /* ============================
           ELIMINAR
        ============================ */

        window.deleteProduct =
            function(id) {

                const product =
                    products.find(
                        item => item.id === id
                    );


                if (!product) return;


                const confirmDelete =
                    confirm(
                        `¿Eliminar "${product.name}"?`
                    );


                if (!confirmDelete) return;


                products =
                    products.filter(
                        item => item.id !== id
                    );


                localStorage.setItem(
                    "cthProducts",
                    JSON.stringify(products)
                );


                renderProducts();

            };


        /* ============================
           ESTADÍSTICAS
        ============================ */

        function updateStats() {

            const totalProducts =
                products.length;


            const totalStock =
                products.reduce(
                    (total, product) =>
                        total + product.stock,
                    0
                );


            const totalValue =
                products.reduce(
                    (total, product) =>
                        total +
                        (product.price *
                        product.stock),
                    0
                );


            document.getElementById(
                "totalProducts"
            ).textContent =
                totalProducts;


            document.getElementById(
                "totalStock"
            ).textContent =
                totalStock;


            document.getElementById(
                "totalValue"
            ).textContent =
                formatPrice(totalValue);

        }


        /* ============================
           PRECIO
        ============================ */

        function formatPrice(value) {

            return "$" +
                Number(value).toLocaleString(
                    "es-AR"
                );

        }


        /* ============================
           SEGURIDAD HTML
        ============================ */

        function escapeHTML(text) {

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ============================
           VISTA PREVIA
        ============================ */

        const imageInput =
            document.getElementById(
                "productImage"
            );

        const preview =
            document.getElementById(
                "productPreview"
            );


        imageInput.addEventListener(
            "input",
            updatePreview
        );


        function updatePreview() {

            const url =
                imageInput.value.trim();


            if (!url) {

                preview.classList.remove("show");

                preview.removeAttribute("src");

                return;

            }


            preview.src = url;

            preview.classList.add("show");

        }


        /* ============================
           INICIAR
        ============================ */

        renderProducts();

    </script>

</body>

</html>
